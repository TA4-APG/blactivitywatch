name: Docker – Central Server

on:
  push:
    branches: [master]
    tags:
      - "v*"
    paths:
      - "central-server/**"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [master]
    paths:
      - "central-server/**"
      - ".github/workflows/docker.yml"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/aw-central-server

jobs:
  build:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── QEMU + buildx for multi-arch builds ─────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to GitHub Container Registry ──────────────────────
      # Only on push events (not on PRs from forks)
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Derive image tags ────────────────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Branch push → :master
            type=ref,event=branch
            # Tag push → :v1.2.3  and  :latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Always add the short SHA
            type=sha,prefix=sha-

      # ── Build (and push on non-PR) ───────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./central-server
          file: ./central-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Install dependencies
        working-directory: central-server
        run: poetry install

      - name: Run tests
        working-directory: central-server
        run: poetry run pytest tests/ -v
